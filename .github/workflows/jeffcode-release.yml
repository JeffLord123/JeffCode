name: JeffCode Release

on:
  push:
    tags:
      - 'jeffcode-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  VSCODE_SKIP_PRELAUNCH: '1'

# Every job writes the release number (the tag without its "jeffcode-" prefix) into product.json as
# "release". The app and the remote server must agree on it: the WSL and SSH extensions download the
# server from serverDownloadUrlTemplate, which points at the assets of that release.

jobs:
  linux-server:
    name: Linux server x64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VSCODE_ARCH: x64
      npm_config_arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libxkbfile-dev libsecret-1-dev libx11-dev pkg-config

      - name: Stamp release
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.release=process.argv[1];fs.writeFileSync('product.json',JSON.stringify(p,null,'\t'))" "${GITHUB_REF_NAME#jeffcode-}"

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for i in 1 2 3 4 5; do
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then echo "pnpm install failed too many times" >&2; exit 1; fi
          done

      - name: Build server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm gulp vscode-reh-linux-x64-min

      - name: Archive
        run: |
          set -e
          test -x ../vscode-reh-linux-x64/bin/jeffcode-server
          mkdir -p dist
          tar -czf dist/jeffcode-reh-linux-x64.tar.gz -C .. vscode-reh-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: jeffcode-reh-linux-x64
          path: dist/*

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      VSCODE_ARCH: x64
      npm_config_arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Stamp release
        shell: bash
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.release=process.argv[1];fs.writeFileSync('product.json',JSON.stringify(p,null,'\t'))" "${GITHUB_REF_NAME#jeffcode-}"

      - name: Install dependencies
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ($i = 1; $i -le 5; $i++) {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 5) { throw 'pnpm install failed too many times' }
          }

      - name: Build and package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          $env:Path = "$($signtool.DirectoryName);$env:Path"
          pnpm gulp vscode-win32-x64-min
          if ($LASTEXITCODE -ne 0) { throw 'package failed' }
          pnpm gulp vscode-win32-x64-inno-updater
          if ($LASTEXITCODE -ne 0) { throw 'inno updater failed' }
          pnpm gulp vscode-win32-x64-user-setup
          if ($LASTEXITCODE -ne 0) { throw 'setup failed' }

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem .build/win32-x64 -Recurse -Filter *.exe | Where-Object { $_.FullName -match 'user-setup' } | Select-Object -First 1
          if (-not $setup) { throw 'user setup exe not found' }
          Copy-Item $setup.FullName dist/JeffCode-Setup-win32-x64.exe
          Compress-Archive -Path ../VSCode-win32-x64/* -DestinationPath dist/JeffCode-win32-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: jeffcode-win32-x64
          path: dist/*

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      VSCODE_ARCH: ${{ matrix.arch }}
      npm_config_arch: ${{ matrix.arch }}
      GYP_DEFINES: "kerberos_use_rtld=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Stamp release
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.release=process.argv[1];fs.writeFileSync('product.json',JSON.stringify(p,null,'\t'))" "${GITHUB_REF_NAME#jeffcode-}"

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 -m pip install --break-system-packages setuptools
          for i in 1 2 3 4 5; do
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then echo "pnpm install failed too many times" >&2; exit 1; fi
          done

      - name: Build and package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm gulp vscode-darwin-${{ matrix.arch }}-min

      - name: Ad-hoc sign and zip
        run: |
          set -e
          APP="../VSCode-darwin-${{ matrix.arch }}/JeffCode.app"
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/JeffCode-darwin-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: jeffcode-darwin-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/jeffcode-')
    needs: [linux-server, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # JeffCode reads these files from the latest release (product.json "updateFeed": "static") to find
      # updates. "version" is the build commit; the app ignores the feed when it matches its own commit.
      - name: Write update feed
        run: |
          set -e
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          release="${GITHUB_REF_NAME#jeffcode-}"
          timestamp="$(date +%s)000"
          setup=dist/JeffCode-Setup-win32-x64.exe
          test -f "$setup"
          jq -n --arg version "$GITHUB_SHA" --arg productVersion "$release" --argjson timestamp "$timestamp" \
            --arg url "$base/download/${GITHUB_REF_NAME}/JeffCode-Setup-win32-x64.exe" \
            --arg sha256hash "$(sha256sum "$setup" | cut -d' ' -f1)" \
            '{version: $version, productVersion: $productVersion, timestamp: $timestamp, url: $url, sha256hash: $sha256hash}' \
            > dist/update-win32-x64-user.json
          for arch in arm64 x64; do
            jq -n --arg version "$GITHUB_SHA" --arg productVersion "$release" --argjson timestamp "$timestamp" \
              --arg url "$base/tag/${GITHUB_REF_NAME}" \
              '{version: $version, productVersion: $productVersion, timestamp: $timestamp, url: $url}' \
              > "dist/update-darwin-${arch}.json"
          done
          cat dist/update-*.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          **Windows:** run `JeffCode-Setup-win32-x64.exe`. Windows SmartScreen may warn (unsigned app): click "More info" then "Run anyway".

          **macOS:** unzip `JeffCode-darwin-arm64.zip` (Apple Silicon) or `JeffCode-darwin-x64.zip` (Intel), move `JeffCode.app` to Applications, then run once in Terminal:

              xattr -cr /Applications/JeffCode.app

          (the app is not notarized by Apple).

          **Updates:** JeffCode checks this page for new releases. On Windows it downloads and installs them in the background, then offers to restart; on macOS it offers to open the download page.

          **WSL:** install the "Open Remote - WSL" extension (jeanp413.open-remote-wsl) from the Extensions view. JeffCode downloads its server for WSL (`jeffcode-reh-linux-x64.tar.gz`) from this release automatically.
          EOF
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
